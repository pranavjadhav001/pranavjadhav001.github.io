<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.lead }}">
  <link rel="icon" href="{{ site.url }}/img/favicon.png">
  <link rel="stylesheet" href="{{ "/css/blogs.css" | prepend: site.baseurl }}">
{% if page.mathjax %}
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
</head>
<body>

{{ content }}

<script>
  (function () {
    var overlay = document.createElement("div");
    overlay.className = "lightbox-overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.setAttribute("aria-hidden", "true");

    var img = document.createElement("img");
    overlay.appendChild(img);

    var closeBtn = document.createElement("button");
    closeBtn.className = "lightbox-close";
    closeBtn.type = "button";
    closeBtn.setAttribute("aria-label", "Close enlarged image");
    closeBtn.textContent = "×";
    overlay.appendChild(closeBtn);

    document.body.appendChild(overlay);

    function openLightbox(src, alt) {
      img.src = src;
      img.alt = alt || "";
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
    }
    function closeLightbox() {
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
      img.src = "";
    }

    document.addEventListener("click", function (e) {
      var target = e.target.closest ? e.target.closest(".figure-frame img") : null;
      if (target) {
        e.preventDefault();
        openLightbox(target.currentSrc || target.src, target.alt);
        return;
      }
      if (e.target === overlay || e.target === closeBtn) {
        closeLightbox();
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeLightbox();
    });
  })();
</script>

<script>

</body>
</html>
