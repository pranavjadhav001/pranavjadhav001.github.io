<script>
(function(){
 var NS="http://www.w3.org/2000/svg", status=document.getElementById("status"), toks=[];
  for (var i=0;i<4;i++){ var g=document.createElementNS(NS,"g"); g.innerHTML='<rect class=\"stroke amber\" x=\"290\" y=\"122\" width=\"4\" height=\"10\"/><rect class=\"stroke amber\" x=\"297\" y=\"116\" width=\"4\" height=\"16\"/><rect class=\"stroke amber\" x=\"304\" y=\"125\" width=\"4\" height=\"7\"/><rect class=\"stroke amber\" x=\"311\" y=\"119\" width=\"4\" height=\"13\"/>'; g.style.opacity=0;
    document.getElementById("tokens").appendChild(g); toks.push(g); }
  var F=[[62, 62, 578, 63, 7.800000000000001, 8.600000000000001], [126, 108, 578, 163, 8.200000000000001, 9.000000000000002], [30, 154, 578, 263, 8.600000000000001, 9.400000000000002]], ghosts=F.map(function(f){ var r=document.createElementNS(NS,"rect"); r.setAttribute("width",24); r.setAttribute("height",32); r.setAttribute("rx",2);
    r.setAttribute("class","stroke amber"); r.style.opacity=0; document.getElementById("ghosts").appendChild(r); return r; });
  function bez(a,b,c,d,u){ var v=1-u; return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d; }
  chalkFigure({ END: 11.0, paint: function(t){
    // each selected report lifts off the grid and flies to its result card
    F.forEach(function(f,i){
      var u=(t-f[4])/(f[5]-f[4]), on=u>=0&&u<1, r=ghosts[i];
      r.style.opacity = on ? 1 : 0;
      if (on){ r.setAttribute("x",bez(f[0],f[0],f[2]-60,f[2],u).toFixed(1)); r.setAttribute("y",bez(f[1],-10,-10,f[3]+18,u).toFixed(1)); }
    });
    // embeddings leave the encoder and settle into the index
    toks.forEach(function(g,i){
      var u=(t-2.4-i*0.35)/0.6, on=u>=0&&u<1;
      g.style.opacity = on ? 1 : 0;
      if (on) g.setAttribute("transform","translate("+(u*90).toFixed(1)+",0)");
    });
    status.textContent =
      t < 2.2 ? "every report goes through the DPR encoder" :
      t < 4.5 ? "and its embedding is saved in an index" :
      t < 6.6 ? "a query is encoded the same way" :
      t < 9.9 ? "the nearest cases come back: direct, abbreviated, paraphrased" :
      "one cohort, however it was written";
  }});
})();
</script>
