<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="Diagram comparing CLIP's softmax loss, which normalizes similarity scores across every row and column of the batch matrix, with SigLIP's sigmoid loss, which scores each image-text pair independently as a binary classification problem">
